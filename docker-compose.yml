# n8n with the four workflows already imported, to try it locally.
#   cp .env.example .env   (fill it in)   then   docker compose up -d
# Already have n8n (your own server or Cloud)? You do not need this file: see
# "Add it to your n8n" in the README.

services:
  n8n:
    image: ${N8N_IMAGE:-n8nio/n8n:2.47.7}
    restart: unless-stopped
    entrypoint: ["sh", "/bootstrap/bootstrap.sh"]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      # The secret for the optional "run now" and setup webhooks (header X-Newsletter-Key).
      NEWSLETTER_KEY: ${NEWSLETTER_KEY:?set NEWSLETTER_KEY in .env}
      # Any OpenAI-compatible API: base address without /chat/completions, model name, key.
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL: ${MODEL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-none}
      # Where the draft goes, and the mail server that carries it.
      TO_EMAIL: ${TO_EMAIL:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      NEWSLETTER_NAME: ${NEWSLETTER_NAME:-}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # Optional: seconds before a failed model call is tried once more (default 20).
      RETRY_WAIT_SECONDS: ${RETRY_WAIT_SECONDS:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/bootstrap/workflows:ro
      - ./docker/bootstrap.sh:/bootstrap/bootstrap.sh:ro
      - ./docker/prepare.mjs:/bootstrap/prepare.mjs:ro
    ports:
      - "${N8N_PORT:-5678}:5678"

volumes:
  n8n_data:
